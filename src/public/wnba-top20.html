<title>WNBA Scoring Top 20</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&display=swap">
<style>
  :root{
    --ink:#14101c; --panel:#1d1728; --panel-2:#241c31; --line:#372c49;
    --text:#f3edf5; --muted:#a297b4;
    --pink:#f0559d; --gold:#d9a441; --pink-deep:#c23579;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--text);
    font-family:'Barlow',system-ui,sans-serif;font-size:15px;line-height:1.45;
    padding-block:0 48px;padding-inline:clamp(16px,4vw,40px)}
  .wrap{max-width:900px;margin:0 auto}
  header{padding-block:34px 24px}
  .kicker{font-weight:700;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
  h1{font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:clamp(32px,6vw,52px);
     margin:0;line-height:1.05;text-wrap:balance}
  h1 .accent{color:var(--pink)}
  .sub{color:var(--muted);font-size:13px;margin-top:6px}

  ol{list-style:none;margin:0;padding:0;display:grid;gap:8px}
  .row{
    display:grid;grid-template-columns:44px 44px 1fr auto;gap:12px;align-items:center;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 16px 10px 10px;
  }
  .row.podium{background:linear-gradient(150deg,var(--panel-2),var(--panel));border-color:#4b3a63}
  .rank{font-family:'Anton';font-size:22px;color:var(--muted);text-align:center}
  .podium .rank{color:var(--gold)}
  .crest{width:44px;height:44px;border-radius:50%;background:var(--pink-deep);
    display:grid;place-items:center;font-family:'Anton';font-size:15px;color:#fff;position:relative;flex:none}
  .crest img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:top;opacity:0}
  .crest img.ok{opacity:1}
  .who{min-width:0}
  .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta{color:var(--muted);font-size:12.5px}
  .nums{display:flex;gap:18px;align-items:baseline;font-variant-numeric:tabular-nums}
  .ppg{font-family:'Anton';font-size:26px;color:var(--pink);line-height:1}
  .ppg small{font-family:'Barlow';font-weight:600;font-size:10.5px;color:var(--muted);letter-spacing:.1em;display:block;text-align:right}
  .aux{font-size:13px;color:var(--muted);text-align:right;line-height:1.5}
  .aux b{color:var(--text);font-weight:600}
  @media(max-width:560px){.aux{display:none}}
  .bar{height:3px;border-radius:2px;background:#2a2138;grid-column:2/-1;position:relative;overflow:hidden}
  .bar i{position:absolute;inset:0;width:var(--w);background:linear-gradient(90deg,var(--pink-deep),var(--pink));border-radius:2px}
  footer{margin-top:16px;font-size:12px;color:var(--muted)}
</style>

<div class="wrap">
  <header>
    <div class="kicker">WomensSEC · WNBA · 2026</div>
    <h1>Scoring <span class="accent">Top 20</span></h1>
    <div class="sub">Points per game, regular season · minimum 10 games played</div>
  </header>
  <ol id="list"></ol>
  <footer>Stats: ESPN public data, refreshed hourly on womenssec.com</footer>
</div>
